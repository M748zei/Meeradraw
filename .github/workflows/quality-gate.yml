name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Logic tests
        run: npm run test:functional:logic
      - name: Generation reliability tests
        run: npm run test:generation-reliability
      - name: Generation reliability tests (Firestore emulator)
        run: |
          npx -y firebase-tools@latest emulators:exec \
            --only firestore \
            --project demo-meeradraw \
            "npm run test:generation-reliability"
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_PROJECT_ID: demo-meeradraw
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-meeradraw
      - name: Production build
        run: npm run build
        env:
          MOCK_AI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
